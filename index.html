<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineApp TV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 220px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; padding: 20px 0; flex-shrink: 0; }
        .logo { font-size: 20px; font-weight: bold; color: #e50914; padding: 0 20px 20px 20px; }
        .menu-section { display: flex; flex-direction: column; gap: 4px; padding: 0 10px; }
        .menu-item { padding: 12px 15px; border-radius: 6px; color: #aaa; cursor: pointer; font-size: 13px; font-weight: 500; outline: none; border: none; background: transparent; text-align: left; }
        .menu-item:focus, .menu-item:hover, .menu-item.active { background: #e50914; color: #fff; }
        .menu-divider { border: none; border-top: 1px solid #222; margin: 15px 10px; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { padding: 15px 25px; background: #111; border-bottom: 1px solid #222; display: flex; justify-content: flex-end; align-items: center; flex-shrink: 0; }
        .search-bar { background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 8px 16px; color: #fff; width: 280px; font-size: 13px; outline: none; }
        .search-bar:focus { border-color: #e50914; }

        .content-scroll { flex: 1; overflow-y: auto; padding: 25px; }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card { background: #161616; border-radius: 8px; overflow: hidden; cursor: pointer; border: 2px solid transparent; outline: none; transition: transform 0.2s; }
        .card:focus, .card:hover { transform: scale(1.04); border-color: #e50914; }
        .card-poster { width: 100%; height: 210px; background: #222; object-fit: cover; display: flex; align-items: center; justify-content: center; color: #555; font-size: 12px; }
        .card-title { padding: 10px; font-size: 12px; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">CineApp TV</div>
        <div class="menu-section">
            <button class="menu-item active" tabindex="0">Inicio</button>
            <button class="menu-item" tabindex="0">Películas</button>
            <button class="menu-item" tabindex="0">Series</button>
            <button class="menu-item" tabindex="0">Favoritos</button>
        </div>
        <hr class="menu-divider">
        <div class="menu-section">
            <button class="menu-item" tabindex="0">Historial</button>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <input type="text" id="searchInput" class="search-bar" placeholder="Buscar películas o series...">
        </div>
        <div class="content-scroll">
            <h2 id="viewTitle" class="section-title">Tendencias de Hoy</h2>
            <div id="resultsGrid" class="grid"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const searchInput = document.getElementById("searchInput");
            const resultsGrid = document.getElementById("resultsGrid");
            const viewTitle = document.getElementById("viewTitle");
            const menuItems = document.querySelectorAll(".menu-item");

            const API_KEY = "8265bd1679663a7ea12ac168da84d2e8";
            const BASE_URL = "https://api.themoviedb.org/3";
            const IMG_URL = "https://image.tmdb.org/t/p/w500";

            let currentView = "inicio";
            let favorites = JSON.parse(localStorage.getItem("cineapp_favs") || "[]");
            let history = JSON.parse(localStorage.getItem("cineapp_hist") || "[]");

            menuItems.forEach(item => {
                item.addEventListener("click", () => {
                    menuItems.forEach(i => i.classList.remove("active"));
                    item.classList.add("active");
                    const text = item.textContent.trim().toLowerCase();

                    if (text.includes("inicio")) {
                        currentView = "inicio";
                        viewTitle.textContent = "Tendencias de Hoy";
                        loadTrending();
                    } else if (text.includes("películas")) {
                        currentView = "movies";
                        viewTitle.textContent = "Películas Populares";
                        loadGenre("movie");
                    } else if (text.includes("series")) {
                        currentView = "series";
                        viewTitle.textContent = "Series Populares";
                        loadGenre("tv");
                    } else if (text.includes("favoritos")) {
                        currentView = "favorites";
                        viewTitle.textContent = "Mis Favoritos";
                        renderGrid(favorites, "No tienes favoritos guardados");
                    } else if (text.includes("historial")) {
                        currentView = "history";
                        viewTitle.textContent = "Historial de Reproducción";
                        renderGrid(history, "No hay historial reciente");
                    }
                });
            });

            function renderGrid(items, emptyMsg) {
                if (!items || items.length === 0) {
                    resultsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #777; padding: 40px; font-size: 14px;">${emptyMsg}</div>`;
                    return;
                }

                resultsGrid.innerHTML = items.map(item => {
                    const title = item.title || item.name || "Sin título";
                    const year = (item.release_date || item.first_air_date || "").split("-")[0] || "N/D";
                    const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : null;

                    return `
                        <div class="card" tabindex="0">
                            <div class="card-poster">
                                ${poster ? `<img src="${poster}" style="width: 100\%; height: 100\%; object-fit: cover;" alt="${title}">` : `<span>Sin Póster</span>`}
                            </div>
                            <div class="card-title">${title} (${year})</div>
                        </div>
                    `;
                }).join("");

                document.querySelectorAll(".card").forEach((card, index) => {
                    card.addEventListener("click", () => openDetail(items[index]));
                });
            }

            async function loadTrending() {
                resultsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #aaa; padding: 30px;">Cargando contenido...</div>`;
                try {
                    const res = await fetch(`${BASE_URL}/trending/all/day?api_key=${API_KEY}&language=es-MX`);
                    const data = await res.json();
                    renderGrid(data.results, "No hay tendencias disponibles");
                } catch (e) {
                    resultsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #e50914; padding: 30px;">Error al conectar.</div>`;
                }
            }

            async function loadGenre(type) {
                resultsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #aaa; padding: 30px;">Cargando...</div>`;
                try {
                    const res = await fetch(`${BASE_URL}/discover/${type}?api_key=${API_KEY}&language=es-MX&sort_by=popularity.desc`);
                    const data = await res.json();
                    const results = data.results.map(item => ({ ...item, media_type: type }));
                    renderGrid(results, "No hay contenido disponible");
                } catch (e) {
                    resultsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #e50914; padding: 30px;">Error de conexión.</div>`;
                }
            }

            async function searchMovies(query) {
                if (!query.trim()) {
                    if (currentView === "inicio") loadTrending();
                    return;
                }

                resultsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #aaa; padding: 30px;">Buscando...</div>`;
                try {
                    const response = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&language=es-MX&query=${encodeURIComponent(query)}&page=1&include_adult=false`);
                    const data = await response.json();
                    viewTitle.textContent = `Resultados para: "${query}"`;
                    renderGrid(data.results, `No se encontraron resultados para "${query}"`);
                } catch (error) {
                    resultsGrid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #e50914; padding: 30px;">Error de búsqueda.</div>`;
                }
            }
            function generateSources(item, season = 1, episode = 1) {
                const id = item.id;
                const isSeries = item.media_type === "tv" || item.first_air_date || item.name;

                if (isSeries) {
                    return [
                        { label: `📺 T${season} E${episode} - Opción Principal`, url: `https://vidsrc.xyz/embed/tv?tmdb=${id}&season=${season}&episode=${episode}`, badge: "HD" },
                        { label: `📺 T${season} E${episode} - Opción Secundaria`, url: `https://vidsrc.me/embed/tv?tmdb=${id}&season=${season}&episode=${episode}`, badge: "FHD" }
                    ];
                } else {
                    return [
                        { label: "🚀 Opción Principal (Película HD)", url: `https://vidsrc.xyz/embed/movie?tmdb=${id}`, badge: "HD" },
                        { label: "🚀 Opción Secundaria", url: `https://vidsrc.me/embed/movie?tmdb=${id}`, badge: "FHD" }
                    ];
                }
            }

            function launchPlayer(title, streamUrl) {
                const playerModal = document.createElement("div");
                playerModal.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:2000; display:flex; flex-direction:column;";
                
                playerModal.innerHTML = `
                    <div style="padding:10px 20px; background:#111; display:flex; justify-content:space-between; align-items:center; z-index:2010;">
                        <span style="color:#fff; font-size:14px; font-weight:bold;">${title}</span>
                        <button id="closePlayer" style="background:#e50914; color:#fff; border:none; padding:6px 14px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:11px;" tabindex="0">✕ Salir</button>
                    </div>
                    <iframe src="${streamUrl}" style="width:100%; height:100%; border:none; background:#000;" allowfullscreen="true" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
                `;

                document.body.appendChild(playerModal);
                const closeBtn = document.getElementById("closePlayer");
                closeBtn.focus();

                const closePlayer = () => {
                    if (playerModal.parentNode) document.body.removeChild(playerModal);
                };

                closeBtn.addEventListener("click", closePlayer);
                document.addEventListener("keydown", function closeOnEsc(e) {
                    if (e.key === "Escape" || e.keyCode === 27 || e.keyCode === 4) {
                        e.preventDefault();
                        closePlayer();
                        document.removeEventListener("keydown", closeOnEsc);
                    }
                });
            }

            function openDetail(item) {
                const title = item.title || item.name || "Sin título";
                const overview = item.overview || "Sin sinopsis disponible.";
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : "";
                const isSeries = item.media_type === "tv" || item.first_air_date || item.name;

                history = [item, ...history.filter(h => h.id !== item.id)].slice(0, 20);
                localStorage.setItem("cineapp_hist", JSON.stringify(history));

                let currentSeason = 1;
                let currentEpisode = 1;

                const modal = document.createElement("div");
                modal.style.cssText = "position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:flex; justify-content:center; align-items:center; z-index:1000; padding:15px;";
                
                function updateModalContent() {
                    const sources = generateSources(item, currentSeason, currentEpisode);

                    modal.innerHTML = `
                        <div style="background:#141414; max-width:650px; width:100%; border-radius:8px; overflow:hidden; border:1px solid #333; display:flex; flex-direction:column; max-height:90vh;">
                            <div style="padding:15px; background:#181818; border-bottom:1px solid #222; display:flex; gap:15px; align-items:center;">
                                ${poster ? `<img src="${poster}" style="width:70px; height:100px; object-fit:cover; border-radius:4px;" />` : ""}
                                <div>
                                    <h2 style="font-size:15px; color:#fff; margin-bottom:5px;">${title} ${isSeries ? `(T${currentSeason} E${currentEpisode})` : ''}</h2>
                                    <p style="font-size:11px; color:#aaa; line-height:1.2; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">${overview}</p>
                                </div>
                            </div>
                            
                            <div style="padding:15px; overflow-y:auto; flex:1;">
                                ${isSeries ? `
                                    <div style="background:#1a1a1a; padding:10px; border-radius:6px; margin-bottom:12px; border:1px solid #333;">
                                        <h3 style="font-size:11px; color:#fff; margin-bottom:6px;">Seleccionar Temporada y Episodio:</h3>
                                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                                            <select id="seasonSelect" style="background:#111; color:#fff; border:1px solid #444; padding:6px; border-radius:4px; font-size:11px;">
                                                <option value="1" ${currentSeason == 1 ? 'selected' : ''}>Temporada 1</option>
                                                <option value="2" ${currentSeason == 2 ? 'selected' : ''}>Temporada 2</option>
                                                <option value="3" ${currentSeason == 3 ? 'selected' : ''}>Temporada 3</option>
                                            </select>
                                            <select id="episodeSelect" style="background:#111; color:#fff; border:1px solid #444; padding:6px; border-radius:4px; font-size:11px;">
                                                ${Array.from({length: 20}, (_, i) => `<option value="${i+1}" ${currentEpisode == i+1 ? 'selected' : ''}>Episodio ${i+1}</option>`).join('')}
                                            </select>
                                        </div>
                                    </div>
                                ` : ''}

                                <h3 style="font-size:11px; color:#aaa; margin-bottom:6px;">Opciones de Reproducción:</h3>
                                <div style="display:flex; flex-direction:column; gap:6px;">
                                    ${sources.map((src) => `
                                        <button class="source-btn" data-url="${src.url}" style="background:#1a1a1a; color:#fff; border:1px solid #333; padding:10px; border-radius:6px; text-align:left; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size:11px;" tabindex="0">
                                            <span>${src.label}</span>
                                            <span style="font-size:9px; background:#e50914; padding:2px 6px; border-radius:3px;">${src.badge}</span>
                                        </button>
                                    `).join("")}
                                </div>
                            </div>

                            <div style="padding:10px 15px; display:flex; gap:10px; background:#111; border-top:1px solid #222;">
                                <button id="favBtn" style="background:#222; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:11px;" tabindex="0">❤️ Favorito</button>
                                <button id="closeBtn" style="background:#222; color:#aaa; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:11px; margin-left:auto;" tabindex="0">Cerrar</button>
                            </div>
                        </div>
                    `;

                    if (isSeries) {
                        document.getElementById("seasonSelect").addEventListener("change", (e) => {
                            currentSeason = e.target.value;
                            updateModalContent();
                        });
                        document.getElementById("episodeSelect").addEventListener("change", (e) => {
                            currentEpisode = e.target.value;
                            updateModalContent();
                        });
                    }

                    document.querySelectorAll(".source-btn").forEach(btn => {
                        btn.addEventListener("click", () => {
                            const url = btn.getAttribute("data-url");
                            document.body.removeChild(modal);
                            launchPlayer(title, url);
                        });
                    });

                    document.getElementById("favBtn").addEventListener("click", () => {
                        if (!favorites.some(f => f.id === item.id)) {
                            favorites.push(item);
                            localStorage.setItem("cineapp_favs", JSON.stringify(favorites));
                            alert("Añadido a Favoritos");
                        } else {
                            alert("Ya está en Favoritos");
                        }
                    });

                    document.getElementById("closeBtn").addEventListener("click", () => {
                        document.body.removeChild(modal);
                    });
                }

                if (!document.body.contains(modal)) document.body.appendChild(modal);
                updateModalContent();
            }

            let timeout = null;
            searchInput.addEventListener("input", (e) => {
                clearTimeout(timeout);
                const query = e.target.value;
                timeout = setTimeout(() => searchMovies(query), 400);
            });

            loadTrending();
        });
    </script>
</body>
</html>
